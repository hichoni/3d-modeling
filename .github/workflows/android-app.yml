name: Android tablet app
# Builds an unsigned release APK of android/ (with offline copies of the built pages) and publishes it on the
# `android-build` branch. It is signed outside CI with the project's private key (tools/android/sign-apk.cjs),
# so this workflow never holds signing material.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android-app.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Package offline pages
        run: |
          mkdir -p android/app/src/main/assets/web
          cp index.html studio.html android/app/src/main/assets/web/
      - name: Build unsigned release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Compile release signing verifier (no private keys in CI)
        run: |
          curl -fsSL -o /tmp/apksig.jar https://repo1.maven.org/maven2/com/android/tools/build/apksig/2.3.0/apksig-2.3.0.jar
          echo '6ef7a58375aa68fb492b58edd97607bee8ee5c5c  /tmp/apksig.jar' | sha1sum -c -
          mkdir -p /tmp/click-sign-classes
          javac -cp /tmp/apksig.jar -d /tmp/click-sign-classes tools/android/SignApk.java
      - name: Publish to the android-build branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/click-studio-unsigned.apk
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const gradle=fs.readFileSync('android/app/build.gradle','utf8');
          const metadata={commit:process.env.GITHUB_SHA,ref:process.env.GITHUB_REF_NAME,run:process.env.GITHUB_RUN_ID,version:gradle.match(/versionName '([^']+)'/)[1],versionCode:Number(gradle.match(/versionCode (\d+)/)[1]),sha256:sha(fs.readFileSync('out/click-studio-unsigned.apk')),offlinePages:Object.fromEntries(['index.html','studio.html'].map(name=>[name,sha(fs.readFileSync(name))]))};
          fs.writeFileSync('out/build.json',JSON.stringify(metadata,null,2)+'\n');
          NODE
          cd out
          git init -q -b android-build
          git add .
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Unsigned Android APK from $GITHUB_SHA"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-build
