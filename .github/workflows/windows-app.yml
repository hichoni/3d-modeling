name: Windows operator app
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'bridge/**', 'src/**', 'index.html', 'studio.html', 'setup.html', 'tests/**', 'scripts/**', '.github/workflows/windows-app.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Preview builds are unsigned; Store builds require your Partner Center identity
        type: choice
        options: [Preview, Store]
        default: Preview
      identity_name:
        description: Package/Identity/Name from Partner Center (Store only)
        type: string
      publisher:
        description: Package/Identity/Publisher from Partner Center, including CN= (Store only)
        type: string
      publisher_display_name:
        description: Publisher display name from Partner Center (Store only)
        type: string
      version:
        description: Four-part MSIX version; increment for each Store update, for example 3.0.1.0
        type: string
        default: '3.0.0.0'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      BUILD_MODE: ${{ inputs.mode || 'Preview' }}
      PACKAGE_VERSION: ${{ inputs.version || '3.0.0.0' }}
      PACKAGE_NAME: ${{ inputs.identity_name }}
      PACKAGE_PUBLISHER: ${{ inputs.publisher }}
      PACKAGE_PUBLISHER_DISPLAY: ${{ inputs.publisher_display_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.402'
      - name: Verify official runtime and packaging tools
        id: tools
        run: ./desktop/bootstrap-tools.ps1
      - name: Build public web and test bridge without printers
        env:
          NODE_BINARY: ${{ steps.tools.outputs.node }}
        run: |
          & $env:NODE_BINARY scripts/build.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:NODE_BINARY --test tests/*.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: One-click booth update keeps runtime (Windows PowerShell)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'update-test'
          Expand-Archive -LiteralPath downloads/booth-setup.zip -DestinationPath $folder
          $workshop = Join-Path $folder 'click-workshop'
          New-Item -ItemType Directory -Path (Join-Path $workshop 'runtime/jobs') -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $workshop 'runtime/config.json') -Value '{"kept":true}'
          Set-Content -LiteralPath (Join-Path $workshop 'runtime/statistics.json') -Value '{"version":1}'
          Set-Content -LiteralPath (Join-Path $workshop 'bridge/server.cjs') -Value '// old'
          powershell.exe -NoProfile -File (Join-Path $workshop 'scripts/update-booth.ps1') -Source (Resolve-Path downloads/booth-setup.zip)
          if ($LASTEXITCODE -ne 0) { throw 'update-booth.ps1 failed' }
          if ((Get-Content -LiteralPath (Join-Path $workshop 'runtime/config.json') -Raw).Trim() -ne '{"kept":true}') { throw 'runtime/config.json changed' }
          if ((Get-Content -LiteralPath (Join-Path $workshop 'bridge/server.cjs') -Raw) -notmatch 'click-workshop') { throw 'bridge was not updated' }
          $backup = @(Get-ChildItem -LiteralPath $workshop -Directory -Filter 'runtime-backup-*')
          if ($backup.Count -ne 1 -or -not (Test-Path (Join-Path $backup[0].FullName 'config.json')) -or (Test-Path (Join-Path $backup[0].FullName 'jobs'))) { throw 'runtime backup missing or includes jobs' }
          Write-Host 'update-booth.ps1: files updated, runtime kept and backed up'
      - name: Build native app and validate MSIX
        env:
          NODE_BINARY: ${{ steps.tools.outputs.node }}
          MAKEAPPX_BINARY: ${{ steps.tools.outputs.makeappx }}
        run: |
          $arguments=@{NodePath=$env:NODE_BINARY;MakeAppxPath=$env:MAKEAPPX_BINARY;OutputRoot=(Join-Path $env:GITHUB_WORKSPACE 'artifacts/ci');Mode=$env:BUILD_MODE;Version=$env:PACKAGE_VERSION}
          if ($env:BUILD_MODE -eq 'Store') {
            if (-not $env:PACKAGE_NAME -or -not $env:PACKAGE_PUBLISHER -or -not $env:PACKAGE_PUBLISHER_DISPLAY) { throw 'Enter all three exact Partner Center identity values. This workflow does not create or verify your Store account.' }
            $arguments.IdentityName=$env:PACKAGE_NAME; $arguments.Publisher=$env:PACKAGE_PUBLISHER; $arguments.PublisherDisplayName=$env:PACKAGE_PUBLISHER_DISPLAY
          }
          ./desktop/build.ps1 @arguments
      - name: Isolated app start-stop test and UI rendering
        run: |
          $report=Join-Path $env:GITHUB_WORKSPACE 'artifacts/desktop-self-test'
          $program=Join-Path $env:GITHUB_WORKSPACE 'artifacts/ci/app/ClickBooth.exe'
          $test=Start-Process -FilePath $program -ArgumentList @('--self-test',('"'+$report+'"')) -WindowStyle Hidden -PassThru
          if (-not $test.WaitForExit(90000)) { throw 'Self-test timeout. No printers are configured in this test.' }
          if ($test.ExitCode -ne 0) { Get-Content (Join-Path $report 'self-test-error.txt') -ErrorAction SilentlyContinue; throw 'Native app self-test failed.' }
          Get-Content (Join-Path $report 'self-test.json')
      - name: Upload review package (not a signed public release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClickBooth-${{ env.BUILD_MODE }}-${{ github.sha }}
          retention-days: 30
          path: |
            artifacts/ci/*.msix
            artifacts/ci/*.json
            artifacts/desktop-self-test/self-test.json
            artifacts/desktop-self-test/self-test-error.txt
            artifacts/desktop-self-test/operator-app.png
